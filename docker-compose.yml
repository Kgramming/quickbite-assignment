version: "3.9"

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: quickbite-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: quickbite_user
      POSTGRES_PASSWORD: quickbite_password
      POSTGRES_DB: quickbite_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - quickbite-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbite_user -d quickbite_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - quickbite-net

  # RabbitMQ message broker with durable exchange and queues
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: quickbite-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: quickbite
      RABBITMQ_DEFAULT_PASS: quickbite_password
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - quickbite-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - quickbite-net

  # QuickBite API (FastAPI)
  api:
    build: .
    container_name: quickbite-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg://quickbite_user:quickbite_password@postgres:5432/quickbite_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: quickbite
      RABBITMQ_PASSWORD: quickbite_password
      RABBITMQ_VHOST: /
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quickbite-net

  # Outbox publisher: relays outbox_events rows to RabbitMQ
  publisher:
    build: .
    container_name: quickbite-publisher
    command: python -m app.outbox_publisher
    environment:
      DATABASE_URL: postgresql+psycopg://quickbite_user:quickbite_password@postgres:5432/quickbite_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: quickbite
      RABBITMQ_PASSWORD: quickbite_password
      RABBITMQ_VHOST: /
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quickbite-net

  # Four independent worker consumers, one service each.
  # Scale any single worker type, e.g.:
  #   docker compose up -d --scale worker-payment=3
  worker-payment:
    build: .
    command: python -m app.worker_service --workers payment
    environment:
      DATABASE_URL: postgresql+psycopg://quickbite_user:quickbite_password@postgres:5432/quickbite_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: quickbite
      RABBITMQ_PASSWORD: quickbite_password
      RABBITMQ_VHOST: /
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quickbite-net

  worker-restaurant:
    build: .
    command: python -m app.worker_service --workers restaurant
    environment:
      DATABASE_URL: postgresql+psycopg://quickbite_user:quickbite_password@postgres:5432/quickbite_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: quickbite
      RABBITMQ_PASSWORD: quickbite_password
      RABBITMQ_VHOST: /
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quickbite-net

  worker-delivery:
    build: .
    command: python -m app.worker_service --workers delivery
    environment:
      DATABASE_URL: postgresql+psycopg://quickbite_user:quickbite_password@postgres:5432/quickbite_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: quickbite
      RABBITMQ_PASSWORD: quickbite_password
      RABBITMQ_VHOST: /
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quickbite-net

  worker-notification:
    build: .
    command: python -m app.worker_service --workers notification
    environment:
      DATABASE_URL: postgresql+psycopg://quickbite_user:quickbite_password@postgres:5432/quickbite_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: quickbite
      RABBITMQ_PASSWORD: quickbite_password
      RABBITMQ_VHOST: /
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quickbite-net

volumes:
  quickbite-postgres-data:
    driver: local
  quickbite-rabbitmq-data:
    driver: local

networks:
  quickbite-net:
    driver: bridge
    name: quickbite-net
