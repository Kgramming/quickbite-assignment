<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite - Fast Food Delivery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            color: #999;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .items-list {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: flex-end;
        }

        .item-row input {
            flex: 1;
        }

        .item-row input[type="number"] {
            flex: 0.5;
        }

        .add-item-btn, .btn-primary, .btn-secondary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-item-btn {
            background: #f0f0f0;
            color: #667eea;
            margin-bottom: 20px;
        }

        .add-item-btn:hover {
            background: #e8e8e8;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #667eea;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-paid { background: #d1ecf1; color: #0c5460; }
        .status-confirmed { background: #d4edda; color: #155724; }
        .status-driver_assigned { background: #d1ecf1; color: #0c5460; }
        .status-payment_failed { background: #f8d7da; color: #721c24; }
        .status-failed { background: #f8d7da; color: #721c24; }

        .result-box {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .result-box.error {
            border-left-color: #dc3545;
            background: #f8d7da;
        }

        .result-box.success {
            border-left-color: #28a745;
            background: #d4edda;
        }

        .result-box h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .result-box p {
            font-size: 13px;
            color: #666;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-size: 14px;
            margin: 20px 0;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-text {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 24px; }
            .content { padding: 20px; }
            .item-row {
                flex-direction: column;
                align-items: stretch;
            }
            .item-row input[type="number"] {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍕 QuickBite</h1>
            <p>Fast Food Delivery</p>
        </div>

        <div class="content">
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('create')">Place Order</button>
                <button class="tab-btn" onclick="switchTab('track')">Track Order</button>
                <button class="tab-btn" onclick="switchTab('health')">Status</button>
            </div>

            <!-- Create Order Tab -->
            <div id="create" class="tab-content active">
                <div class="loading" id="createLoading">
                    <span class="spinner"></span>
                    <span>Creating order...</span>
                </div>

                <form id="orderForm" onsubmit="createOrder(event)" style="display: block;">
                    <div class="form-group">
                        <label>Customer Name *</label>
                        <input type="text" id="customerName" required placeholder="e.g. Alice Johnson">
                    </div>

                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="customerEmail" required placeholder="e.g. alice@example.com">
                    </div>

                    <div class="form-group">
                        <label>Phone *</label>
                        <input type="tel" id="customerPhone" required placeholder="e.g. 5551234567">
                    </div>

                    <div class="form-group">
                        <label>Delivery Address *</label>
                        <textarea id="deliveryAddress" required placeholder="e.g. 123 Main St, Apt 4B" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Items *</label>
                        <div class="items-list" id="itemsList">
                            <div class="item-row">
                                <input type="text" class="item-name" placeholder="Item name" value="Pizza Margherita" required>
                                <input type="number" class="item-quantity" placeholder="Qty" value="1" min="1" required>
                                <input type="number" class="item-price" placeholder="Price" value="12.99" min="0.01" step="0.01" required>
                                <button type="button" class="btn-secondary" onclick="removeItem(this)" style="width: auto; padding: 8px 12px;">✕</button>
                            </div>
                        </div>
                        <button type="button" class="add-item-btn" onclick="addItem()">+ Add Item</button>
                    </div>

                    <button type="submit" class="btn-primary">Place Order</button>
                </form>

                <div id="createResult"></div>
            </div>

            <!-- Track Order Tab -->
            <div id="track" class="tab-content">
                <div class="loading" id="trackLoading" style="display: none;">
                    <span class="spinner"></span>
                    <span>Loading order...</span>
                </div>

                <form id="trackForm" onsubmit="trackOrder(event)">
                    <div class="form-group">
                        <label>Order ID *</label>
                        <input type="text" id="orderId" required placeholder="Paste order ID here">
                    </div>
                    <button type="submit" class="btn-primary">Track Order</button>
                </form>

                <div id="trackResult"></div>
            </div>

            <!-- Health Status Tab -->
            <div id="health" class="tab-content">
                <div class="loading" id="healthLoading" style="display: none;">
                    <span class="spinner"></span>
                    <span>Checking status...</span>
                </div>
                <button type="button" class="btn-primary" onclick="checkHealth()" style="margin-bottom: 20px;">Check System Health</button>
                <div id="healthResult"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8002';

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            
            // Auto-populate Order ID field if switching to Track tab and we have a last order ID
            if (tab === 'track') {
                const lastOrderId = sessionStorage.getItem('lastOrderId');
                if (lastOrderId) {
                    document.getElementById('orderId').value = lastOrderId;
                }
            }
        }

        function addItem() {
            const itemsList = document.getElementById('itemsList');
            const newItem = document.createElement('div');
            newItem.className = 'item-row';
            newItem.innerHTML = `
                <input type="text" class="item-name" placeholder="Item name" required>
                <input type="number" class="item-quantity" placeholder="Qty" value="1" min="1" required>
                <input type="number" class="item-price" placeholder="Price" min="0.01" step="0.01" required>
                <button type="button" class="btn-secondary" onclick="removeItem(this)" style="width: auto; padding: 8px 12px;">✕</button>
            `;
            itemsList.appendChild(newItem);
        }

        function removeItem(btn) {
            btn.parentElement.remove();
        }

        async function createOrder(e) {
            e.preventDefault();
            
            const items = [];
            let totalAmount = 0;
            
            document.querySelectorAll('.item-row').forEach(row => {
                const name = row.querySelector('.item-name').value;
                const quantityStr = row.querySelector('.item-quantity').value;
                const priceStr = row.querySelector('.item-price').value;
                
                if (name && quantityStr && priceStr) {
                    const quantity = parseInt(quantityStr);
                    const price = parseFloat(priceStr);
                    
                    if (quantity > 0 && price > 0) {
                        // Format price to 2 decimal places for API
                        const formattedPrice = price.toFixed(2);
                        items.push({ name, quantity, price: formattedPrice });
                        totalAmount += price * quantity;
                    }
                }
            });

            if (items.length === 0) {
                showResult('createResult', 'At least one item with valid quantity and price is required', 'error');
                return;
            }

            // Format total to 2 decimal places
            const totalAmountStr = totalAmount.toFixed(2);

            const orderData = {
                customer_name: document.getElementById('customerName').value,
                customer_email: document.getElementById('customerEmail').value,
                customer_phone: document.getElementById('customerPhone').value,
                delivery_address: document.getElementById('deliveryAddress').value,
                items: items,
                total_amount: totalAmountStr
            };

            showLoading('createLoading', true);
            try {
                const response = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                const data = await response.json();

                if (response.ok) {
                    // Store order ID in sessionStorage so Track Order tab can use it
                    sessionStorage.setItem('lastOrderId', data.id);
                    
                    const html = `
                        <div class="result-box success">
                            <h3>✓ Order Created Successfully!</h3>
                            <p><strong>Order ID:</strong><br><code style="background: #f0f0f0; padding: 8px; display: block; border-radius: 4px; margin-top: 5px;">${data.id}</code></p>
                            <p><strong>Status:</strong> <span class="status-badge status-${data.status.toLowerCase()}">${data.status}</span></p>
                            <p><strong>Total:</strong> $${data.total_amount}</p>
                            <p style="font-size: 12px; margin-top: 10px; opacity: 0.7;">✓ Order ID copied to Track tab. Go to Track Order to check status.</p>
                        </div>
                    `;
                    showResult('createResult', html, 'success');
                    document.getElementById('orderForm').reset();
                } else {
                    // Handle validation errors from Pydantic
                    let errorMsg = 'Error creating order';
                    if (data.detail) {
                        if (Array.isArray(data.detail)) {
                            // Pydantic validation error format
                            errorMsg = data.detail.map(err => {
                                const field = err.loc[err.loc.length - 1];
                                const msg = err.msg;
                                return `${field}: ${msg}`;
                            }).join('<br>');
                        } else if (typeof data.detail === 'string') {
                            errorMsg = data.detail;
                        }
                    }
                    showResult('createResult', errorMsg, 'error');
                }
            } catch (err) {
                showResult('createResult', 'Network error: ' + err.message, 'error');
            } finally {
                showLoading('createLoading', false);
            }
        }

        async function trackOrder(e) {
            e.preventDefault();
            const orderId = document.getElementById('orderId').value;

            if (!orderId) {
                showResult('trackResult', 'Please enter an Order ID', 'error');
                return;
            }

            showLoading('trackLoading', true);
            try {
                const response = await fetch(`${API_URL}/orders/${orderId}`);
                const data = await response.json();

                if (response.ok) {
                    const statusClass = `status-${data.status.toLowerCase()}`;
                    const html = `
                        <div class="result-box success">
                            <h3>Order Details</h3>
                            <p><strong>Order ID:</strong><br><code style="background: #f0f0f0; padding: 8px; display: block; border-radius: 4px; margin-top: 5px;">${data.id}</code></p>
                            <p><strong>Customer:</strong> ${data.customer_name}</p>
                            <p><strong>Status:</strong><span class="status-badge ${statusClass}">${data.status}</span></p>
                            <p><strong>Total:</strong> $${data.total_amount}</p>
                            <p><strong>Payment:</strong> ${data.payment_status || 'pending'}</p>
                            <p><strong>Created:</strong> ${new Date(data.created_at).toLocaleString()}</p>
                        </div>
                    `;
                    showResult('trackResult', html, 'success');
                } else {
                    let errorMsg = data.detail || 'Order not found';
                    if (typeof errorMsg === 'string' && errorMsg.startsWith('Order')) {
                        // Already formatted
                    } else if (Array.isArray(data.detail)) {
                        errorMsg = 'Invalid Order ID format';
                    }
                    showResult('trackResult', errorMsg, 'error');
                }
            } catch (err) {
                showResult('trackResult', 'Network error: ' + err.message, 'error');
            } finally {
                showLoading('trackLoading', false);
            }
        }

        async function checkHealth() {
            showLoading('healthLoading', true);
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();

                if (response.ok) {
                    const dbStatus = data.database === 'healthy' ? '✓' : '✕';
                    const rmqStatus = data.rabbitmq === 'healthy' ? '✓' : '✕';
                    const html = `
                        <div class="result-box success">
                            <h3>System Status</h3>
                            <p><strong>API:</strong> ${dbStatus} ${data.status}</p>
                            <p><strong>Database:</strong> ${dbStatus} ${data.database}</p>
                            <p><strong>RabbitMQ:</strong> ${rmqStatus} ${data.rabbitmq}</p>
                            <p><strong>Version:</strong> ${data.version}</p>
                        </div>
                    `;
                    showResult('healthResult', html, 'success');
                } else {
                    showResult('healthResult', 'Health check failed', 'error');
                }
            } catch (err) {
                showResult('healthResult', 'Network error: ' + err.message, 'error');
            } finally {
                showLoading('healthLoading', false);
            }
        }

        function showResult(elementId, content, type) {
            const element = document.getElementById(elementId);
            if (typeof content === 'string' && !content.startsWith('<')) {
                element.innerHTML = `<div class="result-box ${type}"><p>${content}</p></div>`;
            } else {
                element.innerHTML = content;
            }
        }

        function showLoading(elementId, show) {
            document.getElementById(elementId).style.display = show ? 'block' : 'none';
        }
    </script>
</body>
</html>
